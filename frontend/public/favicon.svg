<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Menti Vault">
  <title>Menti Vault</title>
  <!--
    Marca del producto: el dial de una caja fuerte recortado en un cuadrado
    redondeado. Es la misma figura que `MarcaDeMenti` en
    `src/shared/ui/Logo.tsx`; aquí el negro va fijo porque la pestaña del
    navegador no sabe del tema de la app.
  -->
  <defs>
    <mask id="dial">
      <rect width="32" height="32" rx="9" fill="white" />
      <circle cx="16" cy="16" r="8.25" fill="none" stroke="black" stroke-width="2.75" />
      <circle cx="16" cy="16" r="2.4" fill="black" />
      <path d="M16 16 L20.6 11.4" stroke="black" stroke-width="2.75" stroke-linecap="round" />
    </mask>
  </defs>
  <rect width="32" height="32" rx="9" fill="#111111" mask="url(#dial)" />
</svg>
