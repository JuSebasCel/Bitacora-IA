<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <title>Menti Vault</title>
    <meta
      name="description"
      content="Convierte conferencias en fichas citables y memorias listas para entregar."
    />

    <!--
      La tarjeta que se ve al compartir el enlace (WhatsApp, Instagram,
      LinkedIn, Slack, X). La imagen va con dirección absoluta porque quien
      la lee no resuelve rutas relativas, y en PNG porque WhatsApp e
      Instagram no aceptan SVG. Se regenera con
      `node scripts/imagenes-para-compartir.mjs`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Menti Vault" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://menti.site/apps/vault/" />
    <meta property="og:title" content="Menti Vault" />
    <meta
      property="og:description"
      content="Convierte conferencias en fichas citables y memorias listas para entregar."
    />
    <meta property="og:image" content="https://menti.site/apps/vault/compartir.png" />
    <meta property="og:image:secure_url" content="https://menti.site/apps/vault/compartir.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Menti Vault sobre fondo negro" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Menti Vault" />
    <meta
      name="twitter:description"
      content="Convierte conferencias en fichas citables y memorias listas para entregar."
    />
    <meta name="twitter:image" content="https://menti.site/apps/vault/compartir.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
